<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mary G Art</title>
    <style>
        body {
            background-color: #000;
            color: white;
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        nav {
            background: rgba(5, 5, 5, 0.9);
            padding: 25px;
            border-bottom: 1px solid #111;
            z-index: 10;
        }
        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            margin: 0;
            padding: 0;
        }
        nav ul li {
            margin: 0 25px;
            position: relative;
        }
        nav ul li a {
            color: #c5a059;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: 0.3s;
        }
        nav ul li a:hover {
            color: #ffffff;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: rgba(10, 10, 10, 0.95);
            min-width: 200px;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            list-style: none;
            padding: 10px 0;
            border: 1px solid #1a1a1a;
            margin-top: 10px;
        }
        .dropdown:hover .dropdown-content {
            display: block;
        }
        .dropdown-content li a {
            font-size: 11px;
            letter-spacing: 2px;
            color: #aa843d;
            display: block;
            padding: 12px 20px;
            text-decoration: none;
            text-align: center;
            transition: 0.3s;
            border-bottom: 1px solid #111;
        }
        .dropdown-content li:last-child a { border-bottom: none; }
        
        /* Slider Styles */
        .slider-container {
            flex: 1;
            position: relative;
            width: 100%;
            background: #000;
        }
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            background-size: contain; 
            background-repeat: no-repeat;
            background-position: center;
        }
        .slide.active {
            opacity: 1;
        }
        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.4);
            color: #c5a059;
            padding: 15px 20px;
            border: none;
            cursor: pointer;
            font-size: 24px;
            z-index: 5;
            transition: 0.3s;
        }
        .arrow:hover { background: rgba(197, 160, 89, 0.8); color: #000; }
        .prev { left: 10px; }
        .next { right: 10px; }
    </style>
</head>
<body>

<audio id="bg-music" src="music.mp3" loop></audio>

<nav>
    <ul>
        <li><a href="index.html">HOME</a></li>
        <li><a href="portfolio.html">PORTFOLIO</a></li>

            </ul>
        </li>
        <li><a href="about-mary.html">ABOUT</a></li>
        <li><a href="videos.html">VIDEOS</a></li>
        <li><a href="press.html">PRESS</a></li>
        <li><a href="commissions.html">COMMISSIONS</a></li>
        <li><a href="contact.html">CONTACT</a></li>
    </ul>
</nav>

<div class="slider-container">
    <div class="slide active" style="background-image: url('marygpainting.jpg');"></div>
    <div class="slide" style="background-image: url('oil/marygoilpainting1.jpg');"></div>
    <div class="slide" style="background-image: url('oil/marygoilpainting2.jpg');"></div>
    <div class="slide" style="background-image: url('oil/marygoilpainting3.JPG');"></div>
    <div class="slide" style="background-image: url('oil/marygoilpainting4.jpg');"></div>
    <div class="slide" style="background-image: url('oil/marygoilpainting6.jpg');"></div>
    
    <button class="arrow prev" onclick="changeSlide(-1)">&#10094;</button>
    <button class="arrow next" onclick="changeSlide(1)">&#10095;</button>
</div>

<script>
    let currentSlide = 0;
    const slides = document.querySelectorAll('.slide');

    function changeSlide(direction) {
        slides[currentSlide].classList.remove('active');
        currentSlide = (currentSlide + direction + slides.length) % slides.length;
        slides[currentSlide].classList.add('active');
    }

    setInterval(() => {
        changeSlide(1);
    }, 2000);

    // تابع هوشمند برای پخش موزیک با هرگونه تعامل (کلیک، لمس، تکان دادن موس)
    function playMusic() {
        const audio = document.getElementById('bg-music');
        if (audio.paused) {
            audio.play().catch(error => console.log("Playback blocked: ", error));
        }
        // حذف شنودگرها بعد از اولین تعامل برای جلوگیری از اجرای تکراری
        events.forEach(subEvent => document.removeEventListener(subEvent, playMusic));
    }

    const events = ['click', 'touchstart', 'mousemove'];
    events.forEach(subEvent => document.addEventListener(subEvent, playMusic));
</script>

</body>
</html>
