<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="U-lbOAonaxe1R14M7Eq2ZTzJVawyFQ7YX38xQ2228-4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARY G. FINE ART</title>
    <style>
        body {
            background-color: #050505;
            color: white;
            margin: 0;
            font-family: 'Inter', Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-top: 160px;
            box-sizing: border-box;
        }

        /* هدر جدید و یکدست گالری - ساختار دو ردیفه متقارن */
        nav { 
            position: fixed; 
            top: 0; 
            width: 100%; 
            background: rgba(5, 5, 5, 0.98); 
            border-bottom: 1px solid #1a1a1a; 
            z-index: 1000; 
            padding: 20px 0; 
        }
        .nav-container { 
            max-width: 1400px; 
            margin: 0 auto; 
            position: relative; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 0 25px; 
            box-sizing: border-box;
        }
        
        /* لوگوی تکی در گوشه بالا سمت چپ */
        .logo-box { 
            position: absolute; 
            left: 25px; 
            top: 2px; 
            display: flex; 
            align-items: center; 
            text-decoration: none; 
        }
        .logo-img { 
            height: 42px; 
            width: 42px; 
            border-radius: 4px; 
            object-fit: cover; 
        }
        
        /* نام تجاری بزرگ و عریض در مرکز */
        .brand-name { 
            font-size: 26px; 
            font-weight: 300; 
            letter-spacing: 10px; 
            text-transform: uppercase; 
            color: #fff; 
            margin-bottom: 18px; 
            text-decoration: none;
            transition: 0.3s;
        }
        .brand-name:hover {
            color: #c5a059;
        }
        
        /* منوهای ردیف دوم */
        .nav-links { 
            display: flex; 
            align-items: center; 
            list-style: none; 
            margin: 0; 
            padding: 0; 
            gap: 35px;
        }
        .nav-links li { 
            position: relative; 
        }
        .nav-links a { 
            color: #888; 
            text-decoration: none; 
            font-size: 14px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            transition: 0.3s; 
            font-weight: 400;
        }
        .nav-links a:hover { 
            color: #c5a059; 
        }
        
        /* منوی کشویی هماهنگ شده SHOP */
        .dropdown-content { 
            display: none; 
            position: absolute; 
            background-color: #0a0a0a; 
            min-width: 160px; 
            border: 1px solid #1a1a1a; 
            top: 100%; 
            left: 50%; 
            transform: translateX(-50%); 
            padding: 10px 0; 
            z-index: 1001; 
        }
        .dropdown:hover .dropdown-content { 
            display: block; 
        }
        .dropdown-content a { 
            display: block; 
            padding: 10px 15px; 
            font-size: 12px; 
            text-align: center; 
            text-transform: none; 
            letter-spacing: 1px;
            border-bottom: 1px solid #111;
        }
        .dropdown-content a:last-child {
            border-bottom: none;
        }
        
        /* Slider Styles */
        .slider-container {
            flex: 1;
            position: relative;
            width: 100%;
            background: #050505;
        }
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            background-size: contain; 
            background-repeat: no-repeat;
            background-position: center;
        }
        .slide.active {
            opacity: 1;
        }
        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.4);
            color: #c5a059;
            padding: 15px 20px;
            border: none;
            cursor: pointer;
            font-size: 24px;
            z-index: 5;
            transition: 0.3s;
        }
        .arrow:hover { background: rgba(197, 160, 89, 0.8); color: #000; }
        .prev { left: 10px; }
        .next { right: 10px; }

        @media (max-width: 900px) {
            nav { padding: 15px 0; }
            .logo-box { position: static; margin-bottom: 10px; }
            .brand-name { margin-bottom: 12px; font-size: 22px; }
            .nav-links { gap: 15px; flex-wrap: wrap; justify-content: center; }
            .nav-links a { font-size: 12px; }
            body { padding-top: 180px; }
        }
    </style>
</head>
<body>

<audio id="bg-music" src="music.mp3" loop></audio>

    <nav>
        <div class="nav-container">
            <!-- لوگوی تکی در سمت چپ ردیف اول -->
            <a href="index.html" class="logo-box">
                <img src="maryglogo.jpg" alt="Logo" class="logo-img">
            </a>
            
            <!-- نام برند بزرگ در مرکز هدر -->
            <a href="index.html" class="brand-name">MARY G.</a>
            
            <!-- ردیف منوها متمرکز در وسط -->
            <ul class="nav-links">
                <li><a href="index.html" style="color: #c5a059;">HOME</a></li>
                <li><a href="portfolio.html">PORTFOLIO</a></li>
                
                <li class="dropdown">
                    <a href="#">SHOP</a>
                    <div class="dropdown-content">
                        <a href="https://www.artmajeur.com/maryam-gomizi-9452417" target="_blank">Original Arts</a>
                        <a href="https://www.artmajeur.com/maryam-gomizi-9452417" target="_blank">Fine Art Prints</a>
                        <a href="https://marygart.gumroad.com/" target="_blank">Digital Assets</a>
                    </div>
                </li>
                
                <li><a href="about-mary.html">ABOUT</a></li>
                <li><a href="videos.html">VIDEOS</a></li>
                <li><a href="press.html">PRESS</a></li>
                <li><a href="commissions.html">COMMISSIONS</a></li>
                <li><a href="contact.html">CONTACT</a></li>
            </ul>
        </div>
    </nav>

<div class="slider-container">
    <div class="slide active" style="background-image: url('marygpainting.jpg');"></div>
    <div class="slide" style="background-image: url('oil/marygoilpainting1.jpg');"></div>
    <div class="slide" style="background-image: url('oil/marygoilpainting2.jpg');"></div>
    <div class="slide" style="background-image: url('oil/marygoilpainting3.JPG');"></div>
    <div class="slide" style="background-image: url('oil/marygoilpainting4.jpg');"></div>
    <div class="slide" style="background-image: url('oil/marygoilpainting6.jpg');"></div>
    
    <button class="arrow prev" onclick="changeSlide(-1)">&#10094;</button>
    <button class="arrow next" onclick="changeSlide(1)">&#10095;</button>
</div>

<script>
    let currentSlide = 0;
    const slides = document.querySelectorAll('.slide');

    function changeSlide(direction) {
        slides[currentSlide].classList.remove('active');
        currentSlide = (currentSlide + direction + slides.length) % slides.length;
        slides[currentSlide].classList.add('active');
    }

    setInterval(() => {
        changeSlide(1);
    }, 2000);

    const audio = document.getElementById('bg-music');

    function playMusic() {
        if (audio && audio.paused) {
            audio.play().catch(error => console.log("Playback blocked: ", error));
        }
    }
    
    document.addEventListener('DOMContentLoaded', () => {
        window.addEventListener('scroll', playMusic, { once: true });
        document.addEventListener('mousemove', playMusic, { once: true });
        document.addEventListener('touchstart', playMusic, { once: true });
        document.addEventListener('click', playMusic, { once: true });
    });

    document.querySelectorAll('.nav-links a, nav a, .logo-box, .brand-name').forEach(link => {
        link.addEventListener('click', function(e) {
            const targetUrl = this.getAttribute('href');
            const targetAttr = this.getAttribute('target');
            
            if (!targetUrl || targetUrl === '#') {
                playMusic();
                return;
            }
            
            if (targetAttr !== '_blank') {
                e.preventDefault();
                playMusic();
                
                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 250);
            }
        });
    });
</script>

</body>
</html>
