<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos - MARY G. FINE ART</title>
    <style>
        body {
            background-color: #050505;
            color: white;
            margin: 0;
            font-family: 'Inter', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-top: 160px;
            box-sizing: border-box;
            line-height: 1.8;
        }
        
        /* هدر جدید و یکدست گالری - ساختار دو ردیفه متقارن */
        nav { 
            position: fixed; 
            top: 0; 
            width: 100%; 
            background: rgba(5, 5, 5, 0.98); 
            border-bottom: 1px solid #1a1a1a; 
            z-index: 1000; 
            padding: 20px 0; 
        }
        .nav-container { 
            max-width: 1400px; 
            margin: 0 auto; 
            position: relative; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 0 25px; 
            box-sizing: border-box;
        }
        
        /* لوگوی تکی در گوشه بالا سمت چپ */
        .logo-box { 
            position: absolute; 
            left: 25px; 
            top: 2px; 
            display: flex; 
            align-items: center; 
            text-decoration: none; 
        }
        .logo-img { 
            height: 42px; 
            width: 42px; 
            border-radius: 4px; 
            object-fit: cover; 
        }
        
        /* نام تجاری بزرگ و عریض در مرکز */
        .brand-name { 
            font-size: 26px; 
            font-weight: 300; 
            letter-spacing: 10px; 
            text-transform: uppercase; 
            color: #fff; 
            margin-bottom: 18px; 
            text-decoration: none;
            transition: 0.3s;
        }
        .brand-name:hover {
            color: #c5a059;
        }
        
        /* منوهای ردیف دوم */
        .nav-links { 
            display: flex; 
            align-items: center; 
            list-style: none; 
            margin: 0; 
            padding: 0; 
            gap: 35px;
        }
        .nav-links li { 
            position: relative; 
        }
        .nav-links a { 
            color: #888; 
            text-decoration: none; 
            font-size: 14px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            transition: 0.3s; 
            font-weight: 400;
        }
        .nav-links a:hover { 
            color: #c5a059; 
        }
        
        /* منوی کشویی هماهنگ شده SHOP */
        .dropdown-content { 
            display: none; 
            position: absolute; 
            background-color: #0a0a0a; 
            min-width: 160px; 
            border: 1px solid #1a1a1a; 
            top: 100%; 
            left: 50%; 
            transform: translateX(-50%); 
            padding: 10px 0; 
            z-index: 1001; 
        }
        .dropdown:hover .dropdown-content { 
            display: block; 
        }
        .dropdown-content a { 
            display: block; 
            padding: 10px 15px; 
            font-size: 12px; 
            text-align: center; 
            text-transform: none; 
            letter-spacing: 1px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 60px auto;
            padding: 0 25px;
            text-align: center;
            box-sizing: border-box;
            flex-grow: 1;
        }
        h1 {
            color: #fff;
            font-size: 28px;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 50px;
            font-weight: 200;
        }
        .video-container {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border: 1px solid #1a1a1a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background: #080808;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        footer { 
            text-align: center; 
            padding: 60px 20px; 
            color: #222; 
            font-size: 10px; 
            letter-spacing: 3px; 
            border-top: 1px solid #1a1a1a; 
            margin-top: 100px; 
        }

        @media (max-width: 850px) {
            nav { padding: 15px 0; }
            .logo-box { position: static; margin-bottom: 10px; }
            .brand-name { margin-bottom: 12px; font-size: 22px; }
            .nav-links { gap: 15px; flex-wrap: wrap; justify-content: center; }
            .nav-links a { font-size: 12px; }
            body { padding-top: 180px; }
        }
    </style>
</head>
<body>

<audio id="bg-music" src="music.mp3" loop></audio>

    <nav>
        <div class="nav-container">
            <!-- لوگوی تکی در سمت چپ ردیف اول -->
            <a href="index.html" class="logo-box">
                <img src="maryglogo.jpg" alt="Logo" class="logo-img">
            </a>
            
            <!-- نام برند بزرگ در مرکز هدر -->
            <a href="index.html" class="brand-name">MARY G.</a>
            
            <!-- ردیف منوها متمرکز در وسط -->
            <ul class="nav-links">
                <li><a href="index.html">HOME</a></li>
                <li><a href="portfolio.html">PORTFOLIO</a></li>
                
                <li class="dropdown">
                    <a href="#">SHOP</a>
                    <div class="dropdown-content">
                        <a href="https://www.artmajeur.com/maryam-gomizi-9452417" target="_blank">Original Arts</a>
                        <a href="https://www.artmajeur.com/maryam-gomizi-9452417" target="_blank">Fine Art Prints</a>
                        <a href="https://marygart.gumroad.com/" target="_blank">Digital Assets</a>
                    </div>
                </li>
                
                <li><a href="about-mary.html">ABOUT</a></li>
                <li><a href="videos.html" style="color: #c5a059;">VIDEOS</a></li>
                <li><a href="press.html">PRESS</a></li>
                <li><a href="commissions.html">COMMISSIONS</a></li>
                <li><a href="contact.html">CONTACT</a></li>
            </ul>
        </div>
    </nav>

<div class="container">
    <h1>Art Process & Creation</h1>
    <div class="video-container">
        <div class="video-wrapper">
            <iframe src="https://www.youtube.com/embed/C0b-ghXVI4M" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>
</div>

<footer>© 2026 MARY G. FINE ART</footer>

<script>
    const audio = document.getElementById('bg-music');

    function playMusic() {
        if (audio && audio.paused) {
            audio.play().catch(error => console.log("Playback blocked: ", error));
        }
    }
    
    document.addEventListener('DOMContentLoaded', () => {
        window.addEventListener('scroll', playMusic, { once: true });
        document.addEventListener('mousemove', playMusic, { once: true });
        document.addEventListener('touchstart', playMusic, { once: true });
        document.addEventListener('click', playMusic, { once: true });
    });

    document.querySelectorAll('.nav-links a, nav a, .logo-box, .brand-name').forEach(link => {
        link.addEventListener('click', function(e) {
            const targetUrl = this.getAttribute('href');
            const targetAttr = this.getAttribute('target');
            
            if (!targetUrl || targetUrl === '#') {
                playMusic();
                return;
            }
            
            if (targetAttr !== '_blank') {
                e.preventDefault();
                playMusic();
                
                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 250);
            }
        });
    });
</script>
</body>
</html>
