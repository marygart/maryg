<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Mary G. Fine Art</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background-color: #050505; color: #fff; font-family: 'Inter', Arial, sans-serif; margin: 0; padding-top: 160px; }
        
        /* هدر جدید گالری لوکس و متقارن */
        nav { 
            position: fixed; 
            top: 0; 
            width: 100%; 
            background: rgba(5, 5, 5, 0.98); 
            border-bottom: 1px solid #1a1a1a; 
            z-index: 1000; 
            padding: 20px 0; 
        }
        .nav-container { 
            max-width: 1400px; 
            margin: 0 auto; 
            position: relative; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 0 25px; 
            box-sizing: border-box;
        }
        
        /* لوگوی تکی در گوشه بالا سمت چپ */
        .logo-box { 
            position: absolute; 
            left: 25px; 
            top: 2px; 
            display: flex; 
            align-items: center; 
            text-decoration: none; 
        }
        .logo-img { 
            height: 42px; 
            width: 42px; 
            border-radius: 4px; 
            object-fit: cover; 
        }
        
        /* نام برند بزرگ و عریض در مرکز هدر */
        .brand-name { 
            font-size: 26px; 
            font-weight: 300; 
            letter-spacing: 10px; 
            text-transform: uppercase; 
            color: #fff; 
            margin-bottom: 18px; 
            text-decoration: none;
            transition: 0.3s;
        }
        .brand-name:hover {
            color: #c5a059;
        }
        
        /* منوهای ردیف دوم در وسط هدر */
        .nav-links { 
            display: flex; 
            align-items: center; 
            list-style: none; 
            margin: 0; 
            padding: 0; 
            gap: 35px;
        }
        .nav-links li { 
            position: relative; 
        }
        .nav-links a { 
            color: #888; 
            text-decoration: none; 
            font-size: 14px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            transition: 0.3s; 
            font-weight: 400;
        }
        .nav-links a:hover { 
            color: #c5a059; 
        }
        
        /* منوی کشویی هماهنگ شده SHOP */
        .dropdown-content { 
            display: none; 
            position: absolute; 
            background-color: #0a0a0a; 
            min-width: 160px; 
            border: 1px solid #1a1a1a; 
            top: 100%; 
            left: 50%; 
            transform: translateX(-50%); 
            padding: 10px 0; 
            z-index: 1001; 
        }
        .dropdown:hover .dropdown-content { 
            display: block; 
        }
        .dropdown-content a { 
            display: block; 
            padding: 10px 15px; 
            font-size: 12px; 
            text-align: center; 
            text-transform: none; 
            letter-spacing: 1px;
        }

        /* بخش اصلی محتوای تماس با ما */
        .contact-section { max-width: 900px; margin: 80px auto; text-align: center; padding: 0 20px; }
        h2 { font-weight: 200; letter-spacing: 12px; text-transform: uppercase; font-size: 2.2em; margin-bottom: 20px; color: #fff; }
        .line { width: 50px; height: 1px; background: #c5a059; margin: 0 auto 50px auto; }
        .contact-info { margin-bottom: 60px; font-size: 16px; color: #888; letter-spacing: 2px; line-height: 2; text-transform: uppercase; font-weight: 300; }
        
        /* چیدمان آیکون‌های شبکه‌های اجتماعی */
        .social-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 60px; max-width: 600px; margin: 0 auto; }
        .social-item { color: #fff; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 20px; transition: 0.5s; }
        .social-item i { font-size: 35px; transition: 0.4s; color: #ffffff; }
        .social-item span { font-size: 10px; text-transform: uppercase; letter-spacing: 3px; color: #555; transition: 0.4s; }
        .social-item:hover { transform: translateY(-12px); }
        .social-item:hover span { color: #fff; letter-spacing: 5px; }

        /* رنگ آیکون‌ها هنگام هاور */
        .social-item:hover .fa-instagram { color: #E1306C; }
        .social-item:hover .fa-x-twitter { color: #fff; }
        .social-item:hover .fa-whatsapp { color: #25D366; }
        .social-item:hover .fa-pinterest { color: #BD081C; }
        .social-item:hover .fa-gem { color: #FEDA03; }
        .social-item:hover .fa-envelope { color: #EA4335; }

        footer { text-align: center; padding: 40px 0; color: #222; font-size: 10px; letter-spacing: 3px; margin-top: 50px; }

        @media (max-width: 850px) {
            nav { padding: 15px 0; }
            .logo-box { position: static; margin-bottom: 10px; }
            .brand-name { margin-bottom: 12px; font-size: 22px; }
            .nav-links { gap: 15px; flex-wrap: wrap; justify-content: center; }
            .nav-links a { font-size: 12px; }
            body { padding-top: 180px; }
        }

        @media (max-width: 600px) {
            .social-grid { grid-template-columns: repeat(2, 1fr); gap: 40px; }
            h2 { font-size: 1.6em; letter-spacing: 6px; }
        }
    </style>
</head>
<body>

<audio id="bg-music" src="music.mp3" loop></audio>

    <nav>
        <div class="nav-container">

            <!-- نام برند بزرگ در مرکز -->
            <a href="index.html" class="brand-name">MARY G.</a>
            
            <!-- ردیف منوها در وسط -->
            <ul class="nav-links">
                <li><a href="index.html">HOME</a></li>
                <li><a href="portfolio.html">PORTFOLIO</a></li>
                
                <li class="dropdown">

                        <a href="https://marygart.gumroad.com/" target="_blank">Digital Assets</a>
                    </div>

                <li><a href="about-mary.html">ABOUT</a></li>

    </nav>

    <div class="contact-section">

        <div class="social-grid">
            <a href="https://www.instagram.com/maryg.paints" target="_blank" class="social-item"><i class="fab fa-instagram"></i><span>Instagram</span></a>
            <a href="https://x.com/Maryggallery" target="_blank" class="social-item"><i class="fab fa-x-twitter"></i><span>Twitter</span></a>
            <a href="https://wa.me/971509551870?text=Hello,%20I%20would%20like%20to%20discuss%20a%20custom%20painting%20project." target="_blank" class="social-item"><i class="fab fa-whatsapp"></i><span>WhatsApp</span></a>
            <a href="https://pin.it/1d76J0Bn9" target="_blank" class="social-item"><i class="fab fa-pinterest"></i><span>Pinterest</span></a>
            <a href="https://og.rarible.com/user/0x78c58c0ce1a7d77abab3ff02ebb74311a42146e8" target="_blank" class="social-item"><i class="fas fa-gem"></i><span>NFT Shop</span></a>
            <a href="mailto:maryg.art2022@gmail.com" class="social-item"><i class="far fa-envelope"></i><span>Email</span></a>
        </div>
    </div>

    <footer>© 2026 MARY G. FINE ART</footer>

<script>
    const audio = document.getElementById('bg-music');

    function playMusic() {
        if (audio && audio.paused) {
            audio.play().catch(error => console.log("Playback context waiting for interaction: ", error));
        }
    }
    
    document.addEventListener('DOMContentLoaded', () => {
        window.addEventListener('scroll', playMusic, { once: true });
        document.addEventListener('mousemove', playMusic, { once: true });
        document.addEventListener('touchstart', playMusic, { once: true });
        document.addEventListener('click', playMusic, { once: true });
    });

    document.querySelectorAll('.nav-links a, nav a, .logo-box, .brand-name').forEach(link => {
        link.addEventListener('click', function(e) {
            const targetUrl = this.getAttribute('href');
            const targetAttr = this.getAttribute('target');
            
            if (!targetUrl || targetUrl === '#') {
                playMusic();
                return;
            }
            
            if (targetAttr !== '_blank') {
                e.preventDefault();
                playMusic();
                
                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 250);
            }
        });
    });
</script>
</body>
</html>
