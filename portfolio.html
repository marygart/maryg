<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Mary G Art</title>
    <style>
        body { background: #050505; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        nav { padding: 30px; text-align: center; border-bottom: 1px solid #111; }
        nav a { color: #555; text-decoration: none; margin: 0 20px; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }
        .container { max-width: 1300px; margin: 60px auto; padding: 0 30px; }
        header h1 { text-align: center; font-weight: 100; letter-spacing: 12px; margin-bottom: 60px; text-transform: uppercase; }

        #folder-section { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 30px; }
        
        .folder-card { 
            cursor: pointer; 
            aspect-ratio: 1.6 / 1; 
            background: #0f0f0f;
            border-radius: 2px;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border: 1px solid #c5a059;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
        }

        .folder-card:hover { 
            background: #c5a059;
            transform: translateY(-8px);
            box-shadow: 0 10px 30px rgba(197, 160, 89, 0.2);
        }

        .folder-card h3 { 
            font-weight: 300; 
            font-size: 13px; 
            letter-spacing: 4px; 
            text-transform: uppercase; 
            color: #fff; 
            text-align: center; 
            padding: 0 20px; 
            transition: all 0.4s;
            z-index: 2;
        }

        .folder-card:hover h3 { color: #000; font-weight: 500; }

        #gallery-section { display: none; }
        .back-bar { margin-bottom: 40px; display: flex; align-items: center; justify-content: space-between; }
        .back-btn { cursor: pointer; color: #888; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; transition: 0.3s; }
        .back-btn:hover { color: #c5a059; }
        h2#current-category { font-weight: 200; letter-spacing: 6px; text-transform: uppercase; margin: 0; flex-grow: 1; text-align: center; color: #c5a059; }

        .gallery-grid { 
            column-count: 3; 
            column-gap: 20px;
        }

        @media (max-width: 900px) { .gallery-grid { column-count: 2; } }
        @media (max-width: 600px) { .gallery-grid { column-count: 1; } }

        .artwork-item {
            position: relative;
            margin-bottom: 20px; 
            break-inside: avoid; 
            overflow: hidden;
            border: 1px solid #1a1a1a;
            transition: 0.5s ease;
        }

        .artwork-item img { 
            width: 100%; 
            display: block; 
            transition: transform 0.6s ease;
        }

        .artwork-item:hover {
            border-color: #c5a059;
            box-shadow: 0 10px 25px rgba(197, 160, 89, 0.15);
        }

        .artwork-item:hover img {
            transform: scale(1.05);
        }

        .artwork-overlay {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            padding: 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            opacity: 0;
            transition: 0.4s;
            text-align: center;
        }

        .artwork-item:hover .artwork-overlay { opacity: 1; }
        .artwork-overlay span { color: #c5a059; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; }

        footer { text-align: center; padding: 60px 20px; color: #333; font-size: 10px; letter-spacing: 3px; }
    </style>
</head>
<body>

<nav>
    <a href="index.html">HOME</a> 
    <a href="portfolio.html" style="color:#fff">PORTFOLIO</a>
</nav>

<div class="container">
    <header><h1>MARY G ART</h1></header>

    <div id="folder-section">
        <div class="folder-card" onclick="openGallery('Acrylic Paintings', 'acrylic', 'marygacrylic', 1)"><h3>Acrylic Paintings</h3></div>
        
        <div class="folder-card" onclick="openGallery('Oil Paintings', 'oil', 'marygoilpainting', 4)"><h3>Oil Paintings</h3></div>
        <div class="folder-card" onclick="openGallery('Colored Pencils', 'pencil', 'marygpainting', 3)"><h3>Colored Pencils</h3></div>
        <div class="folder-card" onclick="openGallery('Charcoal Realism', 'charcoal', 'maryghyper', 11)"><h3>Charcoal Realism</h3></div>
        <div class="folder-card" onclick="openGallery('Graphite Realism', 'graphite', 'marygdrawing', 11)"><h3>Graphite Realism</h3></div>
        <div class="folder-card" onclick="openGallery('Mix Media', 'mix', 'marygmixmedia', 1)"><h3>Mix Media</h3></div>
        <div class="folder-card" onclick="openGallery('Leather & Textile Painting', 'leather', 'marygleathertextilepainting', 4)"><h3>Leather & Textile Painting</h3></div>
    </div>

    <div id="gallery-section">
        <div class="back-bar">
            <div class="back-btn" onclick="closeGallery()">← BACK</div>
            <h2 id="current-category"></h2>
            <div style="width:60px"></div>
        </div>
        <div class="gallery-grid" id="image-container"></div>
    </div>
</div>

<footer>© 2026 MARY G. FINE ART | DUBAI, UAE</footer>

<script>
    function openGallery(displayName, githubFolder, prefix, count) {
        const container = document.getElementById('image-container');
        container.innerHTML = '';
        document.getElementById('current-category').innerText = displayName;

        for (let i = 1; i <= count; i++) {
            let fileName;
            if (prefix === 'marygpainting') {
                fileName = (i === 1) ? "marygpainting.jpg" : "marygpainting" + (i-1) + ".jpg";
            } else if (prefix === 'marygmixmedia') {
                fileName = "marygmixmedia.jpg";
            } else {
                fileName = prefix + i + ".jpg";
            }
            
            const imgPath = githubFolder + "/" + fileName;
            const item = document.createElement('div');
            item.className = 'artwork-item';
            
            const img = document.createElement('img');
            img.src = imgPath;
            img.alt = displayName;
            
            const overlay = document.createElement('div');
            overlay.className = 'artwork-overlay';
            overlay.innerHTML = `<span>Mary G Art</span>`;
            
            img.onerror = function() { item.style.display = 'none'; };
            
            item.appendChild(img);
            item.appendChild(overlay);
            container.appendChild(item);
        }

        document.getElementById('folder-section').style.display = 'none';
        document.getElementById('gallery-section').style.display = 'block';
        window.scrollTo(0,0);
    }

    function closeGallery() {
        document.getElementById('folder-section').style.display = 'grid';
        document.getElementById('gallery-section').style.display = 'none';
    }
</script>

</body>
</html>
