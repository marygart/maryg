<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Mary G Art</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/css/lightbox.min.css" rel="stylesheet" />
    <style>
        body { background: #050505; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        nav { padding: 40px; text-align: center; border-bottom: 1px solid #111; }
        nav a { color: #555; text-decoration: none; margin: 0 20px; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; transition: 0.3s; }
        nav a:hover { color: #c5a059; }
        .container { max-width: 1400px; margin: 60px auto; padding: 0 40px; }
        header h1 { text-align: center; font-weight: 100; letter-spacing: 12px; margin-bottom: 80px; text-transform: uppercase; font-size: 24px; color: #fff; }
        
        #folder-section { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .folder-card { cursor: pointer; aspect-ratio: 1.6 / 1; background: #0a0a0a; border: 1px solid #1a1a1a; display: flex; align-items: center; justify-content: center; transition: 0.4s; }
        .folder-card:hover { border-color: #c5a059; transform: translateY(-5px); }
        .folder-card h3 { font-weight: 300; font-size: 13px; letter-spacing: 4px; text-transform: uppercase; color: #888; pointer-events: none; }
        
        #gallery-section { display: none; }
        .back-bar { margin-bottom: 50px; display: flex; align-items: center; justify-content: space-between; }
        .back-btn { cursor: pointer; color: #666; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; border: 1px solid #222; padding: 10px 20px; transition: 0.3s; }
        .back-btn:hover { color: #fff; border-color: #c5a059; }
        h2#current-category { font-weight: 200; letter-spacing: 6px; text-transform: uppercase; margin: 0; color: #c5a059; font-size: 18px; }
        
        .gallery-grid { display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; }
        .artwork-item { flex: 0 1 calc(33.333% - 40px); margin-bottom: 50px; text-decoration: none; display: flex; flex-direction: column; }
        @media (max-width: 1100px) { .artwork-item { flex: 0 1 calc(50% - 40px); } }
        @media (max-width: 750px) { .artwork-item { flex: 0 1 100%; } }
        
        .img-wrapper { background: #0f0f0f; padding: 12px; border: 1px solid #1a1a1a; transition: 0.4s; position: relative; cursor: pointer; }
        .artwork-item img { width: 100%; height: 450px; object-fit: contain; background: #050505; display: block; }
        .artwork-item:hover .img-wrapper { border-color: #c5a059; transform: translateY(-8px); box-shadow: 0 15px 30px rgba(0,0,0,0.5); }
        
        .artwork-info { margin-top: 20px; text-align: center; min-height: 40px; }
        .artwork-title { color: #ffffff; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; font-weight: 400; line-height: 1.4; }
        
        .lb-caption, .lb-number { display: none !important; }
        footer { text-align: center; padding: 80px 20px; color: #222; font-size: 9px; letter-spacing: 4px; border-top: 1px solid #111; margin-top: 50px; text-transform: uppercase; }
    </style>
</head>

        <div class="folder-card" onclick="openGallery('Graphite Realism', 'graphite', 'marygdrawing', 11)"><h3>Graphite Realism</h3></div>
        <div class="folder-card" onclick="openGallery('Mix Media', 'mix', 'marygmixmedia', 1)"><h3>Mix Media</h3></div>
        <div class="folder-card" onclick="openGallery('Leather & Textile Painting', 'leather', 'marygleathertextilepainting', 4)"><h3>Leather & Textile Painting</h3></div>

    <div id="gallery-section">

        <div class="gallery-grid" id="image-container"></div>
    </div>
</div>
<footer>© 2026 MARY G. FINE ART</footer>
