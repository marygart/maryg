<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Mary G Art</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/css/lightbox.min.css" rel="stylesheet" />
    <style>
        body { background: #050505; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        nav { padding: 30px; text-align: center; border-bottom: 1px solid #111; }
        nav a { color: #555; text-decoration: none; margin: 0 20px; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }
        .container { max-width: 1400px; margin: 60px auto; padding: 0 40px; }
        header h1 { text-align: center; font-weight: 100; letter-spacing: 12px; margin-bottom: 60px; text-transform: uppercase; }
        
        /* استایل‌های بخش پوشه‌ها (فولدرها) */
        #folder-section { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 40px; }
        .folder-card { cursor: pointer; aspect-ratio: 1.6 / 1; background: #0f0f0f; border-radius: 4px; display: flex; align-items: center; justify-content: center; border: 1px solid #333; transition: all 0.4s; position: relative; overflow: hidden; }
        .folder-card:hover { border-color: #c5a059; transform: translateY(-8px); box-shadow: 0 15px 35px rgba(197, 160, 89, 0.1); }
        .folder-card h3 { font-weight: 300; font-size: 14px; letter-spacing: 4px; text-transform: uppercase; color: #fff; text-align: center; padding: 0 20px; transition: 0.4s; z-index: 2; }
        .folder-card:hover h3 { color: #000; font-weight: 500; }
        
        /* استایل‌های گالری موزاییکی (Masonry Grid) */
        #gallery-section { display: none; }
        .back-bar { margin-bottom: 50px; display: flex; align-items: center; justify-content: space-between; }
        .back-btn { cursor: pointer; color: #888; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; transition: 0.3s; }
        .back-btn:hover { color: #c5a059; }
        h2#current-category { font-weight: 200; letter-spacing: 6px; text-transform: uppercase; margin: 0; flex-grow: 1; text-align: center; color: #c5a059; font-size: 24px; }
        
        /* تنظیمات Masonry: استفاده از ستون‌های شناور */
        .gallery-grid {
            columns: 3; /* در دسکتاپ ۳ ستون */
            column-gap: 30px; /* فاصله بین ستون‌ها */
        }
        @media (max-width: 1000px) { .gallery-grid { columns: 2; } } /* در تبلت ۲ ستون */
        @media (max-width: 600px) { .gallery-grid { columns: 1; column-gap: 0; } } /* در موبایل ۱ ستون */

        .artwork-item {
            display: inline-block; /* بسیار مهم برایMasonry */
            width: 100%; /* عرض کامل ستون */
            margin-bottom: 30px; /* فاصله زیر هر اثر */
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            transition: 0.5s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .artwork-item img {
            width: 100%;
            height: auto; /* حفظ نسبت تصویر اصلی */
            display: block;
            transition: transform 0.6s ease;
        }
        .artwork-item:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 30px rgba(197, 160, 89, 0.15);
        }
        .artwork-overlay { position: absolute; bottom: 0; left: 0; width: 100%; padding: 25px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); opacity: 0; transition: 0.4s; text-align: left; }
        .artwork-item:hover .artwork-overlay { opacity: 1; }
        .artwork-overlay span { color: #c5a059; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; display: block; }
        .artwork-overlay .artwork-title { color: #fff; font-size: 16px; letter-spacing: 1px; margin-top: 5px; font-weight: 300; }

        footer { text-align: center; padding: 80px 20px; color: #333; font-size: 11px; letter-spacing: 3px; border-top: 1px solid #111; margin-top: 60px; }
    </style>
</head>
<body>
<nav><a href="index.html">HOME</a><a href="portfolio.html" style="color:#fff">PORTFOLIO</a></nav>
<div class="container">
    <header><h1>MARY G ART</h1></header>
    <div id="folder-section">
        <div class="folder-card" onclick="openGallery('Acrylic Paintings', 'acrylic', 'marygacrylic', 7)"><h3>Acrylic Paintings</h3></div>
        <div class="folder-card" onclick="openGallery('Oil Paintings', 'oil', 'marygoilpainting', 4)"><h3>Oil Paintings</h3></div>
        <div class="folder-card" onclick="openGallery('Colored Pencils', 'pencil', 'marygpainting', 3)"><h3>Colored Pencils</h3></div>
        <div class="folder-card" onclick="openGallery('Charcoal Realism', 'charcoal', 'maryghyper', 11)"><h3>Charcoal Realism</h3></div>
        <div class="folder-card" onclick="openGallery('Graphite Realism', 'graphite', 'marygdrawing', 11)"><h3>Graphite Realism</h3></div>
        <div class="folder-card" onclick="openGallery('Mix Media', 'mix', 'marygmixmedia', 1)"><h3>Mix Media</h3></div>
        <div class="folder-card" onclick="openGallery('Leather & Textile Painting', 'leather', 'marygleathertextilepainting', 4)"><h3>Leather & Textile Painting</h3></div>
    </div>
    <div id="gallery-section">
        <div class="back-bar">
            <div class="back-btn" onclick="closeGallery()">← BACK</div>
            <h2 id="current-category"></h2>
            <div style="width:60px"></div>
        </div>
        <div class="gallery-grid" id="image-container"></div>
    </div>
</div>
<footer>© 2026 MARY G. FINE ART | DUBAI, UAE</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/js/lightbox.min.js"></script>
<script>
    function openGallery(displayName, githubFolder, prefix, count) {
        const container = document.getElementById('image-container');
        container.innerHTML = '';
        document.getElementById('current-category').innerText = displayName;
        
        // تغییرات Lightbox برای تنظیمات حرفه‌ای
        lightbox.option({
            'resizeDuration': 200,
            'wrapAround': true,
            'alwaysShowNavOnTouchDevices': true,
            'showImageNumberLabel': false, // شماره تصویر را نشان ندهد
            'disableScrolling': true // موقع نمایش کل صفحه اسکرول نشود
        });

        for (let i = 1; i <= count; i++) {
            let fileName = prefix + i + ".jpg";
            if (prefix === 'marygpainting') {
                fileName = (i === 1) ? "marygpainting.jpg" : "marygpainting" + (i-1) + ".jpg";
            } else if (prefix === 'marygmixmedia') {
                fileName = "marygmixmedia.jpg";
            }
            const imgPath = githubFolder + "/" + fileName;
            
            // ایجاد لینک Lightbox برای هر تصویر
            const artworkLink = document.createElement('a');
            artworkLink.href = imgPath;
            artworkLink.setAttribute('data-lightbox', githubFolder); // دسته‌بندی تصاویر برای ناوبری
            artworkLink.setAttribute('data-title', displayName + " - Mary G Fine Art"); // عنوان پایین تصویر
            artworkLink.className = 'artwork-item';

            const img = document.createElement('img');
            img.src = imgPath;
            img.alt = displayName;
            img.onerror = function() {
                if (!this.src.endsWith(".JPG")) {
                    this.src = this.src.replace(".jpg", ".JPG");
                } else {
                    artworkLink.style.display = 'none';
                }
            };

            const overlay = document.createElement('div');
            overlay.className = 'artwork-overlay';
            overlay.innerHTML = `<span>Mary G Art</span><div class="artwork-title">${displayName} #${i}</div>`;
            
            artworkLink.appendChild(img);
            artworkLink.appendChild(overlay);
            container.appendChild(artworkLink);
        }
        document.getElementById('folder-section').style.display = 'none';
        document.getElementById('gallery-section').style.display = 'block';
        window.scrollTo(0,0);
    }
    function closeGallery() {
        document.getElementById('folder-section').style.display = 'grid';
        document.getElementById('gallery-section').style.display = 'none';
    }
</script>
</body>
</html>
